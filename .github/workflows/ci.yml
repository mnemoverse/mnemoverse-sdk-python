name: ci

# The gate release.yml's "Test" and "Typecheck" steps run — before this
# workflow, only at tag time. A PR could merge with a suite nobody ran: #15
# added 5 tests across two commits (44 -> 49 -> 51 passed) and a strict-mypy
# pass, entirely from a local run, because nothing here checked either.
#
# Mirrors release.yml's install/test/typecheck steps exactly, so a PR and a
# tag see the same gate. Matrixed across every Python version pyproject.toml
# declares (release.yml itself only runs one, 3.12, at tag time) — the
# broader PR-time matrix is what actually backs the `Programming Language ::
# Python :: 3.1{0,1,2,3}` classifiers.
#
# Deliberately NOT included: ruff. `ruff check .` currently reports ~20
# pre-existing findings (import sorting, blind-except, PYI034/036, a couple
# of `subprocess.run` and `try/except/pass` patterns) that predate this
# workflow, so wiring it in today would turn the gate red on the first run
# for code nobody touched. Follow-up, once that backlog is triaged.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Typecheck
        run: python -m mypy mnemoverse
