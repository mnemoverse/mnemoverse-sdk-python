[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemoverse"
version = "0.3.2"
description = "Official Python SDK for Mnemoverse — hosted AI agent memory that learns from outcomes. Sync and async REST client."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Eduard Izgorodin", email = "hello@mnemoverse.com" },
]
keywords = [
    "ai-memory",
    "agent-memory",
    "persistent-memory",
    "long-term-memory",
    "llm-memory",
    "ai-agents",
    "feedback",
    "mcp",
    "claude",
    "cursor",
    "chatgpt",
    "rest-api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://mnemoverse.com"
Documentation = "https://mnemoverse.com/docs/api/python-sdk"
Repository = "https://github.com/mnemoverse/mnemoverse-sdk-python"
Source = "https://github.com/mnemoverse/mnemoverse-sdk-python"
Issues = "https://github.com/mnemoverse/mnemoverse-sdk-python/issues"
Changelog = "https://github.com/mnemoverse/mnemoverse-sdk-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # No transport-level HTTP mock on purpose. The suite talks to a real
    # HTTP/1.1 keep-alive server (tests/keepalive_server.py) from the standard
    # library, because a double that keeps no connection alive cannot see a
    # bug about a stranded connection, which is how 0.2.0 shipped one.
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
